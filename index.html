<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Reviewer xxx</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="topbar">
        <div class="topbar-in">
            <button class="icon-btn" id="menuBtn" data-act="menu" aria-label="Open library menu"></button>
            <button class="brand" data-act="home" aria-label="reviewer xxx dashboard"><span class="brand-mark"
                    id="brandMark"></span><span class="t">Notchs</span></button>
            <div class="gsearch"><label><span id="gsIcon"></span><input id="gs" type="search"
                        placeholder="Search topics, sections and terms" aria-label="Search everything"
                        autocomplete="off"><kbd>/</kbd></label>
                <div class="sres" id="sres" hidden></div>
            </div>
            <div class="streak" id="streak" title="Study streak"></div>
            <button class="icon-btn" id="themeBtn" data-act="theme" aria-label="Switch theme"></button>
        </div>
    </header>
    <div class="shell">
        <aside class="side" id="side" aria-label="Library"></aside>
        <main class="main" id="main"></main>
    </div>
    <div class="backdrop" id="backdrop" data-act="closemenu" hidden></div>
    <div class="toast" id="toast" role="status" hidden></div>
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
